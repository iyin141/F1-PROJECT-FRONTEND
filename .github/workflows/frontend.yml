name: frontend
on:
  push:
    branches: [master, main, "v2/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_MODE: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      # Playwright is pinned here until it is added to devDependencies (then drop --no-save and this pin).
      - run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - run: npx tsc -p e2e/tsconfig.json
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
      - run: scripts/perf.sh
        continue-on-error: true # budgets are reported first; make this required once baselines are known

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: NEXT_PUBLIC_API_MODE=live
